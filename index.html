<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    background-color: black;
    height: 100vh;
    align-items: center;
    gap: 30px;
  }

  #myinput {
    max-width: 500px;
    min-width: 300px;
    min-height: 50px;
    border: none;
    border-radius: 50px;
    color: #ff8000;
    padding-left: 10px;
    font-size: 15px;
    -webkit-box-shadow: #FFF 0 -1px 4px, #ff0 0 -2px 10px, #ff8000 0 -10px 20px, red 0 -18px 40px, 5px 5px 15px 5px rgba(0, 0, 0, 0);
    box-shadow: #FFF 0 -1px 4px, #ff0 0 -2px 10px, #ff8000 0 -10px 20px, red 0 -18px 40px, 5px 5px 15px 5px rgba(0, 0, 0, 0);
    caret-color: black;

  }

  #myinput:focus {
    outline: none;
    background-color: rgb(237, 237, 237);
  }

  input::placeholder {
    justify-content: center;
    text-align: center;
    font-size: 15px;
  }

  .burn-animation {
    animation: burn 1s forwards;
  }

  @keyframes burn {
    0% {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: brightness(2);
    }

    50% {
      opacity: 0.7;
      transform: translateY(-20px) scale(1.1) rotate(2deg);
      filter: blur(1px) brightness(1.5);
    }

    100% {
      opacity: 0;
      transform: translateY(-50px) scale(1.2) rotate(-3deg);
      filter: blur(3px) brightness(0.5);
    }
  }

  h1 {
    color: #FFFFFF;
    text-shadow: 0 -1px 4px #FFF, 0 -2px 10px #ff0, 0 -10px 20px #ff8000, 0 -18px 40px #F00;

  }

  .wrong-number{
    background-color: rgb(143, 3, 3) !important;
  }
</style>

<body>
  <h1>Guess the number</h1>
  <input id="myinput" type="text" placeholder="entrer votre valeur">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="script.js"></script>
</body>

</html>
